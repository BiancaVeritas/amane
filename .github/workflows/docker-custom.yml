name: Publish custom Docker image

# 仅用于本 fork 的 custom/* 分支: 构建修改版镜像并推到 GHCR.
# 与上游 docker.yml 分开, 避免合并上游时冲突.
on:
  push:
    branches:
      - "custom/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amane" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # custom/v0.24.1 -> custom-v0.24.1; 固定别名 custom; 短 sha 便于回溯
          tags: |
            type=ref,event=branch
            type=raw,value=custom
            type=sha,format=short,prefix=custom-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
